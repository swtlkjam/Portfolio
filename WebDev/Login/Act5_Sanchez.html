<!DOCTYPE html>
<head>
  <title>Validating a Registration and Login Form Using Javascript</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2>Registration</h2>
      <form id="registrationForm">
        <label for="regUsername">Username:</label>
        <input type="text" id="regUsername" required><br>

        <label for="regEmail">Email:</label>
        <input type="email" id="regEmail" required><br>

        <label for="regPassword">Password:</label>
        <input type="password" id="regPassword" required><br>

        <label for="regConfirmPassword">Confirm Password:</label>
        <input type="password" id="regConfirmPassword" required><br>

        <input type="submit" value="Register">
      </form>
    </div>

    <div class="form-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" required><br>

        <label for="loginPassword">Password:</label>
        <input type="password" id="loginPassword" required><br>

        <input type="submit" value="Login">
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
